name: Publish to crates.io

on:
  push:
    branches:
      - master
      - main
    paths:
      - "Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Test & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check if current Cargo.toml version is already on crates.io
        id: check
        run: |
          NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          LOCAL_VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          PUBLISHED_VERS=$(curl -sSf -H "User-Agent: musicdb-ci" "https://crates.io/api/v1/crates/${NAME}" | jq -r '.versions[].num' || true)
          if echo "${PUBLISHED_VERS}" | grep -qx "${LOCAL_VER}"; then
            echo "Version ${LOCAL_VER} of ${NAME} is already published on crates.io; skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version ${LOCAL_VER} of ${NAME} is not yet on crates.io; proceeding to publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.check.outputs.should_publish == 'true'
        run: cargo test

      - name: Authenticate with crates.io
        if: steps.check.outputs.should_publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: steps.check.outputs.should_publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
